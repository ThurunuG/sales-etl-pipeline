services:
  postgres:
    image: postgres:16
    container_name: sales_etl_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_dw}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_user} -d ${POSTGRES_DB:-sales_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
